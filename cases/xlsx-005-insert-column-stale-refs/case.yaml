id: xlsx-005
slug: insert-column-stale-refs
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [insert-columns, cross-sheet-references, formulas]
title: Inserting a column silently breaks formulas on another sheet
title_zh: 插入一列后，另一张工作表上的公式悄悄错位
files:
  inputs: [orders.xlsx]
  outputs: [orders.xlsx]
failure:
  expected: >
    Discount is column C, holding the listed discounts as fractions formatted as percentages. Every
    Line Total is Unit Price × Qty × (1 − Discount) and follows its inputs, and the Summary shows the
    correct total revenue, total units and average unit price and follows changes on Lines (for
    example with formulas that point at Line Total (E), Qty (D) and Unit Price (B)).
  expected_zh: >
    Discount 位于 C 列，存放清单中的折扣（小数，百分比格式）。每行 Line Total 都等于 Unit Price × Qty × (1 − Discount)
    并随输入变化；Summary 显示正确的总收入、总数量和平均单价，并随 Lines 表的变化而更新（例如公式指向
    Line Total（E）、Qty（D）和 Unit Price（B））。
  observed: >
    In the failure file, Lines has the new Discount column in C (0.05, 0.15, 0, ... formatted 0%),
    Qty in D and a Line Total formula on every line in E (for example =B2*D2*(1-C2)), all with the
    right values. The Summary sheet still holds the formulas of the input: Total revenue is
    =SUM(Lines!D2:D12), which now adds up Qty, and Total units is =SUM(Lines!C2:C12), which now adds
    up the discounts. After recalculation Total revenue is 333.00 instead of 27,468.645 and Total
    units 0.45 instead of 333, while Average unit price (=AVERAGE(Lines!B2:B12)) is still right at
    77.26. No cell shows an error. In a copy of the file where every line's Unit Price, Discount and
    Qty are changed, Total units becomes 3.96 instead of 399.
  observed_zh: >
    失败文件中，Lines 表的 C 列是新的 Discount 列（0.05、0.15、0……，格式为 0%），D 列是 Qty，E 列每一行都是
    Line Total 公式（如 =B2*D2*(1-C2)），数值都正确。Summary 表仍是输入文件里的公式：Total revenue 为
    =SUM(Lines!D2:D12)，现在加总的是 Qty；Total units 为 =SUM(Lines!C2:C12)，现在加总的是折扣。重新计算后，
    Total revenue 为 333.00（应为 27,468.645），Total units 为 0.45（应为 333），而 Average unit price
    （=AVERAGE(Lines!B2:B12)）仍正确，为 77.26。没有任何单元格显示错误。在把每行的 Unit Price、Discount 和 Qty
    都改掉的副本中，Total units 变为 3.96，应为 399。
  claim: >
    I inserted the Discount column between Unit Price and Qty, entered the discounts and updated the
    Line Total formula to apply them. The Summary sheet did not need changes.
  claim_zh: 我在 Unit Price 和 Qty 之间插入了 Discount 列，填好折扣，并更新了 Line Total 公式以计入折扣。Summary 表无需修改。
  explanation: >
    The sheet the agent edited is correct. The damage is on a different sheet, and it produces
    plausible numbers rather than #REF! errors. In a spreadsheet application, inserting a column
    shifts every reference to the moved cells automatically; openpyxl does not.
  explanation_zh: >
    智能体编辑的那张表是对的；损坏发生在另一张表上，而且给出的是看似合理的数字，而不是 #REF! 错误。
    在表格软件中插入列时，所有指向被移动单元格的引用都会自动调整，openpyxl 却不会。
  failing_rules: [summary-correct, summary-live]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    openpyxl insert_cols() moves cells but does not rewrite formulas, including those on other
    sheets (documented behaviour).
limitations:
  - en: Average unit price is unaffected by the insertion in this layout, so that figure alone would not reveal the stale references.
    zh: 在这个布局下，平均单价不受插入影响，单看它发现不了引用过期。
  - en: Liveness is tested in one changed copy of the file (every line's Unit Price, Discount and Qty changed by a different amount). Formula text is never inspected, so a formula that happens to give the right results for both the original and the changed inputs would pass.
    zh: 实时性只在一个修改过的副本中检验（每行的 Unit Price、Discount 和 Qty 各改为不同的值）。检查不读公式文本，因此若某个公式恰好在原始输入和修改后的输入下都给出正确结果，也会通过。
  - en: Line Totals are accepted exact or rounded to whole cents (at most one cent from the exact amount, in either direction). Total revenue is accepted if it is exact, rounded to whole cents, or the sum of the accepted Line Totals. Other rounding, for example to 0.1, fails.
    zh: Line Total 可以是精确值，也可以取整到分（与精确值相差不超过 1 分，向上向下均可）。总收入若为精确值、取整到分的值，或各行已接受的 Line Total 之和，均判为正确。其他取整方式（例如取整到 0.1）判为失败。
  - en: An empty Discount cell is accepted for a product that is not listed (it counts as 0 in the formulas), and the number format of an empty cell is not checked.
    zh: 未列出的产品，Discount 单元格留空也被接受（在公式中按 0 计算），空单元格的数字格式不检查。
