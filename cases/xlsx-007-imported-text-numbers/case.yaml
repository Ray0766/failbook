id: xlsx-007
slug: imported-text-numbers
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [data-types, text-numbers, dates, import, sumif]
title: Imported amounts and dates are stored as text, so totals ignore them
title_zh: 导入的金额和日期被存成文本，汇总公式直接忽略了它们
files:
  inputs: [expenses.xlsx]
  outputs: [expenses.xlsx]
failure:
  expected: >
    The six new rows hold real dates and real numbers, every Summary total (category, month, grand
    total) includes them, and the Summary totals still follow the expense log.
  expected_zh: >
    六条新记录存的是真正的日期和数字，Summary 的每项合计（类别、月份、总计）都包含它们，并且仍随费用记录变化。
  observed: >
    In the failure file the six new expenses are in rows 17 to 22 of Expenses, but every date and
    amount in them is a text string exactly as in the CSV, for example '2024-03-02' in A17 and
    '1,766.34' in D17 (format General), while the existing rows hold real dates and numbers. The
    Summary formulas are unchanged (=SUMIF(Expenses!B:B,A2,Expenses!D:D) and so on). After
    recalculation no total includes any of the new expenses: Travel is 854.66 instead of 2,621.00,
    March is 0.00 instead of 7,410.42 and the grand total is 7,835.07 instead of 15,245.49. January
    and February are right, because all new expenses are in March.
  observed_zh: >
    失败文件中，六笔新费用位于 Expenses 表第 17 至 22 行，但其中每个日期和金额都是与 CSV 一字不差的文本，
    例如 A17 为 '2024-03-02'，D17 为 '1,766.34'（格式为 General），而原有各行存的是真正的日期和数字。Summary 的公式未变
    （=SUMIF(Expenses!B:B,A2,Expenses!D:D) 等）。重新计算后，没有一项合计计入了任何一笔新费用：Travel 为 854.66，
    应为 2,621.00；March 为 0.00，应为 7,410.42；总计为 7,835.07，应为 15,245.49。January 和 February 是对的，
    因为新费用都在三月。
  claim: >
    I appended the 6 expenses from the bank export to the Expenses sheet. The Summary formulas
    cover the whole columns, so they pick up the new rows automatically.
  claim_zh: 我已把银行导出的 6 笔费用追加到 Expenses 表。Summary 的公式覆盖整列，会自动纳入新行。
  explanation: >
    Text that looks like a number is still text, and SUMIF, SUMIFS and SUM skip it. The illustrative
    claim about whole-column formulas is true, so the reasoning sounds right; a look at the March
    total or the grand total after the change would have shown the gap.
  explanation_zh: >
    看起来像数字的文本仍然是文本，SUMIF、SUMIFS 和 SUM 都会跳过它。示例声明中"公式覆盖整列"的说法本身没错，所以推理听起来很合理；
    改完后看一眼 March 合计或总计，就能发现缺口。
  failing_rules: [amounts-are-numbers, dates-are-dates, summary-includes-new]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    csv.reader returns strings; writing them unchanged stores text in the cells.
limitations:
  - en: Only ISO dates and comma thousands separators appear in the export; other locales' formats are not exercised.
    zh: 导出中只有 ISO 日期和逗号千分位，其他地区格式未覆盖。
  - en: Whether the Summary totals still follow the expense log is tested in one changed copy of the file (every existing expense given a different amount, category and month; the appended rows are left as they are); formula text is never inspected.
    zh: Summary 各项合计是否仍随费用记录变化，只在一个修改过的副本中检验（每笔原有费用各改为不同的金额、类别和月份，新追加的行保持不变）；检查不读公式文本。
