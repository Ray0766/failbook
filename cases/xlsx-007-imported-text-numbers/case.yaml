tags: [data-types, text-numbers, dates, import, sumif]
title: Imported amounts and dates are stored as text, so totals ignore them
title_zh: 导入的金额和日期被存成文本，汇总公式直接忽略了它们
files:
  inputs: [expenses.xlsx]
  outputs: [expenses.xlsx]
failure:
  expected: >
    The six new rows hold real dates and real numbers, and every Summary total (category, month,
    grand total) includes them.
  expected_zh: >
    六条新记录存的是真正的日期和数字，Summary 的每项合计（类别、月份、总计）都包含它们。
  observed: >
    The agent pasted the bank export into the sheet row by row, exactly as the CSV text. Amounts such
    as "1,280.00" and dates such as "2024-03-04" went in as strings. They look normal in the grid,
    but SUMIF and SUMIFS skip text, so the Summary totals do not include any of the new expenses.
  observed_zh: >
    智能体把银行导出的 CSV 原样逐行写进表格，"1,280.00" 这样的金额和 "2024-03-04" 这样的日期都成了字符串。
    它们在表格里看起来正常，但 SUMIF/SUMIFS 会跳过文本，于是 Summary 的各项合计一笔新费用都没算进去。
  claim: >
    I appended the 6 expenses from the bank export to the Expenses sheet. The Summary formulas
    cover the whole columns, so they pick up the new rows automatically.
  claim_zh: 我已把银行导出的 6 笔费用追加到 Expenses 表。Summary 的公式覆盖整列，会自动纳入新行。
  explanation: >
    Text that looks like a number is still text. The claim about whole-column formulas is true, so
    the reasoning sounds right; the agent simply never checked a total after the change.
  explanation_zh: >
    看起来像数字的文本仍然是文本。关于"公式覆盖整列"的说法本身没错，所以推理听起来很合理；只是智能体改完后从没核对过任何一个合计。
  failing_rules: [amounts-are-numbers, dates-are-dates, summary-includes-new]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    csv.reader returns strings; writing them unchanged stores text in the cells.
limitations:
