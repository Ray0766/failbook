id: xlsx-007
slug: imported-text-numbers
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [data-types, text-numbers, dates, import, sumif]
title: Imported amounts and dates are stored as text, so totals ignore them
title_zh: 导入的金额和日期被存成文本，汇总公式直接忽略了它们
files:
  inputs: [expenses.xlsx]
  outputs: [expenses.xlsx]
failure:
  expected: >
    The six new rows hold real dates and real numbers, formatted like the existing rows, every
    Summary total (category, month, grand total) includes them, and the Summary totals still follow
    the expense log.
  expected_zh: >
    六条新记录存的是真正的日期和数字，格式与现有行一致，Summary 的每项合计（类别、月份、总计）都包含它们，并且仍随费用记录变化。
  observed: >
    In the failure file the six new expenses are in rows 17 to 22 of Expenses, but every date and
    amount in them is a text string exactly as in the CSV, for example '2024-03-02' in A17 and
    '1,766.34' in D17 (both format General), while the existing rows hold real dates and numbers. The
    Summary formulas are unchanged (=SUMIF(Expenses!B:B,A2,Expenses!D:D) and so on). After
    recalculation no total includes any of the new expenses: Travel is 854.66 instead of 2,621.00,
    March is 0.00 instead of 7,410.42 and the grand total is 7,835.07 instead of 15,245.49. January
    and February are right, because all new expenses are in March.
  observed_zh: >
    失败文件中，六笔新费用位于 Expenses 表第 17 至 22 行，但其中每个日期和金额都是与 CSV 一字不差的文本，
    例如 A17 为 '2024-03-02'，D17 为 '1,766.34'（两者格式均为 General），而原有各行存的是真正的日期和数字。Summary 的公式未变
    （=SUMIF(Expenses!B:B,A2,Expenses!D:D) 等）。重新计算后，没有一项合计计入了任何一笔新费用：Travel 为 854.66，
    应为 2,621.00；March 为 0.00，应为 7,410.42；总计为 7,835.07，应为 15,245.49。January 和 February 是对的，
    因为新费用都在三月。
  claim: >
    I appended the 6 expenses from the bank export to the Expenses sheet. The Summary formulas
    cover the whole columns, so they pick up the new rows automatically.
  claim_zh: 我已把银行导出的 6 笔费用追加到 Expenses 表。Summary 的公式覆盖整列，会自动纳入新行。
  explanation: >
    Text that looks like a number is still text, and SUMIF, SUMIFS and SUM skip it. The illustrative
    claim about whole-column formulas is true, so the reasoning sounds right; a look at the March
    total or the grand total after the change would have shown the gap.
  explanation_zh: >
    看起来像数字的文本仍然是文本，SUMIF、SUMIFS 和 SUM 都会跳过它。示例声明中"公式覆盖整列"的说法本身没错，所以推理听起来很合理；
    改完后看一眼 March 合计或总计，就能发现缺口。
  failing_rules: [amounts-are-numbers, dates-are-dates, summary-includes-new]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    csv.reader returns strings; writing them unchanged stores text in the cells.
limitations:
  - en: Only ISO dates and comma thousands separators appear in the export; other locales' formats are not exercised.
    zh: 导出中只有 ISO 日期和逗号千分位，其他地区格式未覆盖。
  - en: Whether the Summary totals still follow the expense log is tested in one changed copy of the file (every existing expense given a different amount, a category other than its own and a month other than its own, spread so that every category and every month gets rows; the appended rows are left as they are); formula text is never inspected.
    zh: Summary 各项合计是否仍随费用记录变化，只在一个修改过的副本中检验（每笔原有费用各改为不同的金额，以及与原来不同的类别和月份，并使每个类别、每个月份都分到记录；新追加的行保持不变）；检查不读公式文本。
  - en: "\"Formatted like the existing rows\" is checked as the number formats of Date and Amount, the columns the existing rows format (yyyy-mm-dd and #,##0.00). Formats that differ only in these ways count as the same (checked in LibreOffice 24.2 by showing dates, positive, negative and zero numbers and text, which they show alike): letter case; a literal written plainly, quoted or backslash-escaped (as LibreOffice saves it); a text section that is only @ (yyyy-mm-dd;@); a zero section equal to the first; a locale tag with no currency symbol on a date of digits written without / ([$-409]yyyy-mm-dd). A negative section that is - and a first section of digits (#,##0.00;-#,##0.00) also counts as the same, although it shows a negative number that rounds to zero as -0.00 where #,##0.00 shows 0.00: the task's amounts are all positive. On a date it does not count (yyyy-mm-dd;-yyyy-mm-dd shows -1766.34 as -1904-10-31, not 1895-02-27). Under a locale tag, / in a date shows that locale's date separator. For the 15 tags tried in LibreOffice 24.2 (en-US system locale) the checker uses the separator shown there: LibreOffice re-saves [$-41D]yyyy-mm-dd as [$-41D]yyyy/mm/dd, which still shows 2024-03-02 and passes, while [$-409]yyyy/mm/dd shows 2024/03/02 and [$-407]yyyy/mm/dd 2024.03.02, which fail. For any other tag, a date format that matches apart from / is INCONCLUSIVE, neither a pass nor a fail. Excel's display was not tried. Any other difference fails, even where the cells happen to look the same here: a time part in the date format, 0.00 instead of #,##0.00, an empty section (it hides values), or a locale tag on #,##0.00 (it sets the separators: [$-407]#,##0.00 shows 1.766,34). Category and Description (General in the existing rows), fonts, fills, borders and alignment are not compared."
    zh: "“格式与现有行一致”按数字格式检查：比较 Date 和 Amount 两列，即现有行设置了格式的列（yyyy-mm-dd 和 #,##0.00）。只在以下方面不同的格式视为同一格式（已在 LibreOffice 24.2 中用日期、正数、负数、零和文本核对，显示相同）：字母大小写；字面字符直接写、加引号或用反斜杠转义（如 LibreOffice 保存的写法）；只含 @ 的文本段（yyyy-mm-dd;@）；与第一段相同的零值段；不含 / 的纯数字日期上不带货币符号的地区标记（[$-409]yyyy-mm-dd）。由 - 加只含数字的第一段构成的负数段（#,##0.00;-#,##0.00）也视为同一格式，尽管它把舍入为零的负数显示为 -0.00，而 #,##0.00 显示 0.00：本任务的金额都是正数。日期上的这种负数段不算同一格式（yyyy-mm-dd;-yyyy-mm-dd 把 -1766.34 显示为 -1904-10-31，而不是 1895-02-27）。在地区标记下，日期中的 / 显示该地区的日期分隔符。对在 LibreOffice 24.2（系统区域为 en-US）中试过的 15 个地区标记，检查器采用那里显示的分隔符：LibreOffice 把 [$-41D]yyyy-mm-dd 另存为 [$-41D]yyyy/mm/dd，显示仍为 2024-03-02，判为通过；[$-409]yyyy/mm/dd 显示 2024/03/02、[$-407]yyyy/mm/dd 显示 2024.03.02，判为失败。对其他地区标记，除 / 外都相同的日期格式判为 INCONCLUSIVE，既不通过也不失败。未在 Excel 中验证显示效果。其他差异即使在这里碰巧显示相同也判为失败：日期格式带时间部分、用 0.00 代替 #,##0.00、空的格式段（会隐藏数值），或 #,##0.00 上的地区标记（它决定分隔符：[$-407]#,##0.00 显示为 1.766,34）。Category 和 Description（现有行为 General）以及字体、填充、边框和对齐不作比较。"
