id: xlsx-002
slug: margin-hardcoded
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [formulas, hardcoded-values, live-formulas]
title: A calculated column is pasted in as fixed numbers
title_zh: 计算列被写成了固定数值，而不是公式
files:
  inputs: [pricing.xlsx]
  outputs: [pricing.xlsx]
failure:
  expected: >
    Column E holds, for every product, (Price − Cost) / Price, not rounded and formatted as a
    percentage, and the margins follow later changes of Cost or Price.
  expected_zh: >
    E 列每个产品都是未取整的 (Price − Cost) / Price，百分比格式，毛利率会随之后的成本或价格变化。
  observed: >
    Column E ("Margin %", formatted 0.0%) holds plain numbers, not formulas, for all 17 products,
    for example 0.518127… in E2 for P-62860. Each equals (Price − Cost) / Price for today's data, so
    the sheet looks finished. In a copy of the file where every Cost and Price is changed, all 17
    margins stay as they were (P-62860 stays 0.518127 instead of 0.839401).
  observed_zh: >
    E 列（“Margin %”，格式 0.0%）中 17 个产品存放的都是普通数字而非公式，例如 P-62860 的 E2 为 0.518127…。
    每个值都等于当前数据下的 (Price − Cost) / Price，表格看上去已经完成。在把所有 Cost 和 Price 都改掉的副本中，
    17 个毛利率全部保持不变（P-62860 仍是 0.518127，应为 0.839401）。
  claim: >
    I added a Margin % column (E) for all products, calculated as (Price - Cost) / Price and formatted as
    a percentage.
  claim_zh: 我为所有产品添加了 Margin % 列（E 列），按 (Price - Cost) / Price 计算，并设为百分比格式。
  explanation: >
    Every number on screen is correct, so spot checks pass. The difference only shows when an input
    changes, which is exactly the situation the user cares about.
  explanation_zh: >
    屏幕上每个数字都是对的，抽查也能通过。只有输入变化时才看得出差别，而这恰恰是用户真正关心的场景。
  failing_rules: [margins-are-live]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    No tool fault: the values were computed outside the spreadsheet and written as constants.
limitations:
  - en: Liveness is tested in one changed copy of the file (every Cost halved, every Price raised by half); formula text is never inspected.
    zh: 实时性只在一个修改过的副本中检验（每个 Cost 减半、每个 Price 提高一半）；检查不读公式文本。
  - en: Margins are compared with (Price − Cost) / Price to within 0.000001 (0.0001 percentage points), and formula text is never inspected. A margin rounded with ROUND() therefore fails only where the rounding moves it by more than that tolerance. Rounding to 4 decimals (fail_rounded_margin.py) fails, but rounding to 6 or more decimals, for example ROUND((D2-C2)/D2,6), moves a margin by at most 0.0000005 and passes, although the task says not to round it.
    zh: 毛利率与 (Price − Cost) / Price 的比较容差为 0.000001（即 0.0001 个百分点），检查不读公式文本。因此用 ROUND() 取整的毛利率，只有在取整使其偏离超过该容差时才判为失败。取整到 4 位小数（fail_rounded_margin.py）判为失败；取整到 6 位或更多小数（例如 ROUND((D2-C2)/D2,6)）最多偏离 0.0000005，会通过，尽管任务要求不要取整。
