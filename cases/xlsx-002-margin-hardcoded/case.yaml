title: A calculated column is pasted in as fixed numbers
title_zh: 计算列被写成了固定数值，而不是公式
files:
  inputs: [pricing.xlsx]
  outputs: [pricing.xlsx]
failure:
  expected: >
    Column E holds a formula per product equal to (Price − Cost) / Price, formatted as a percentage,
    so margins follow later changes of Cost or Price.
  expected_zh: >
    E 列每个产品都是 (Price − Cost) / Price 的公式，百分比格式，毛利率会随之后的成本或价格变化。
  observed: >
    Asked for a Margin % column that stays correct when prices change, the agent computed every margin
    in Python and wrote the results into the sheet as plain numbers. Today's values are right, so
    the sheet looks finished, but the column will be wrong after the next price change.
  observed_zh: >
    任务要求新增一个毛利率（Margin %）列，并在价格变化时保持正确。智能体却在 Python 里算好每个毛利率，
    再把结果作为普通数字写进表格。眼下的数值都对，看上去已经完成；但下次调价后，这一列就错了。
  claim: >
    I added a Margin % column (E) for all products, calculated as (Price - Cost) / Price and formatted as
    a percentage.
  claim_zh: 我为所有产品添加了 Margin % 列（E 列），按 (Price - Cost) / Price 计算，并设为百分比格式。
  explanation: >
    Every number on screen is correct, so spot checks pass. The difference only shows when an input
    changes, which is exactly the situation the user cares about.
  explanation_zh: >
    屏幕上每个数字都是对的，抽查也能通过。只有输入变化时才看得出差别，而这恰恰是用户真正关心的场景。
  failing_rules: [margins-are-live]
classification:
