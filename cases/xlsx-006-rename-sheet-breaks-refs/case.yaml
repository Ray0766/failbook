id: xlsx-006
slug: rename-sheet-breaks-refs
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [rename-sheet, cross-sheet-references, defined-names]
title: Renaming a sheet breaks every formula that referred to it
title_zh: 重命名工作表后，所有引用它的公式都失效了
files:
  inputs: [report.xlsx]
  outputs: [report.xlsx]
failure:
  expected: >
    The sheet is called 'Sales 2024', every formula and the RevenueRange name refer to it, and the
    Dashboard shows the same figures as before.
  expected_zh: >
    工作表名为 'Sales 2024'，所有公式和 RevenueRange 名称都指向它，Dashboard 数字与之前相同。
  observed: >
    In the failure file the sheet is called 'Sales 2024' and holds the original data, but nothing
    that referred to it was updated. The Dashboard formulas still read the old sheet name
    (=SUMIFS(Data!C:C,Data!A:A,A2) for each region and =AVERAGE(Data!C2:C13)), and the defined name
    RevenueRange, used by =SUM(RevenueRange), still points to Data!$C$2:$C$13. The file stores no
    cached results for these formulas and asks for a full recalculation when it is opened. After
    recalculation every Dashboard figure (B2 to B7) is #NAME?.
  observed_zh: >
    失败文件中，工作表已改名为 'Sales 2024'，数据与原来相同，但所有引用它的地方都没有更新。Dashboard 上的公式仍写着旧表名
    （各区域为 =SUMIFS(Data!C:C,Data!A:A,A2)，另有 =AVERAGE(Data!C2:C13)），=SUM(RevenueRange) 所用的命名区域
    RevenueRange 也仍指向 Data!$C$2:$C$13。文件中没有保存这些公式的缓存结果，并要求在打开时完整重新计算。
    重新计算后，Dashboard 上的每个数字（B2 至 B7）都是 #NAME?。
  claim: >
    I renamed the sheet 'Data' to 'Sales 2024'. No other changes were needed; the Dashboard is
    unaffected.
  claim_zh: 我已将工作表 'Data' 重命名为 'Sales 2024'。无需其他修改，Dashboard 不受影响。
  explanation: >
    Renaming a sheet in a spreadsheet application updates all references automatically, so it feels
    like a one-line change. Setting the title with openpyxl does not. openpyxl also drops the cached
    results and marks the file for a full recalculation on load, so the errors appear as soon as the
    workbook is opened in a spreadsheet application; a tool that edits the XML directly and keeps the
    cached values could instead go on showing the old numbers until the next recalculation.
  explanation_zh: >
    在表格软件里重命名工作表会自动更新所有引用，所以这感觉只是一行代码的事；用 openpyxl 修改标题却不会更新引用。
    openpyxl 还会丢弃缓存结果，并把文件标记为打开时完整重新计算，因此在表格软件中一打开工作簿就会出现这些错误；
    若某个工具直接改写 XML 并保留缓存值，则可能在下一次重新计算之前一直显示旧的数字。
  failing_rules: [dashboard-values, dashboard-live]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    Setting Worksheet.title in openpyxl renames only the sheet; formulas and defined names are left
    unchanged.
limitations:
  - en: 'LibreOffice reports the broken references as #NAME?; the grader explains them by finding the formula that names a missing sheet.'
    zh: 'LibreOffice 把失效引用显示为 #NAME?；评分器会找出引用了不存在工作表的公式来说明原因。'
  - en: Liveness is tested in one changed copy of the file (every revenue on 'Sales 2024' raised by a different amount); formula text is never inspected.
    zh: 实时性只在一个修改过的副本中检验（'Sales 2024' 上的每笔收入各加上不同的值）；检查不读公式文本。
