id: xlsx-004
slug: sort-scrambles-formulas
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [sorting, formulas, relative-references]
title: Sorting rows leaves each formula pointing at its old row
title_zh: 排序后，每个公式仍指向原来的行
files:
  inputs: [staff.xlsx]
  outputs: [staff.xlsx]
failure:
  expected: >
    Rows are sorted by Department and then Name, every person's data stays on one row, and each
    Bonus formula refers to its own row.
  expected_zh: >
    各行按部门、再按姓名排序，每个人的数据在同一行，每个 Bonus 公式都指向本行。
  observed: >
    The rows are sorted by Department, then Name, and each person's Name, Department, Base Salary
    and Bonus Rate are still together, but each Bonus formula is the text from that person's
    original row. Ava Yilmaz is now on row 3 and her Bonus is =C13*D13: row 13 was her row before
    the sort and now holds Yuki Quist, so she shows Yuki's 16,650 instead of her own 2,625. 15 of
    the 16 bonuses equal another person's Base Salary × Bonus Rate; only Dina Khan, whose row did
    not move (row 4, =C4*D4), has her own.
  observed_zh: >
    各行已按部门、再按姓名排序，每个人的 Name、Department、Base Salary、Bonus Rate 仍在同一行，但每个 Bonus
    公式都是此人原来所在行的公式文本。Ava Yilmaz 现在在第 3 行，她的 Bonus 是 =C13*D13：第 13 行是她排序前所在的行，
    现在放的是 Yuki Quist，所以她显示的是 Yuki 的 16,650，而不是她自己的 2,625。16 个奖金中有 15 个等于另一个人的
    Base Salary × Bonus Rate；只有位置没变的 Dina Khan（第 4 行，=C4*D4）是她自己的。
  claim: >
    The Staff table is now sorted by Department and then by Name. All rows were kept intact and the
    Bonus column still uses its formula.
  claim_zh: Staff 表已先按部门、再按姓名排序。所有行都完整保留，Bonus 列仍使用原来的公式。
  explanation: >
    Nothing looks broken: there are no errors, the order is right, and the bonuses are in a plausible
    range. Only checking a row's bonus against that row's salary reveals the mix-up.
  explanation_zh: >
    表面上没有任何异常：没有报错、顺序正确、奖金数值也在合理范围内。只有拿某一行的奖金去对照该行的薪资，才会发现张冠李戴。
  failing_rules: [bonus-matches-row, bonus-is-live]
