id: xlsx-014
slug: delete-rows-shifts-formulas
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: hard
tags: [delete-rows, formulas, cross-sheet-references, totals]
title: Deleting rows leaves formulas pointing at the wrong rows
title_zh: 删除行之后，公式指向了错误的行
files:
  inputs: [inventory.xlsx]
  outputs: [inventory.xlsx]
failure:
  expected: >
    Discontinued rows are deleted without gaps, and the Value, Total and Summary formulas compute
    correctly for the remaining rows and stay live.
  expected_zh: >
    停产行被删除且无空行，Value、Total 和 Summary 公式对剩余行计算正确并保持实时。
  observed: >
    The four Discontinued rows are gone and the 14 remaining items are in rows 2 to 15, but no formula
    was rewritten. Thirteen of the 14 Value formulas still use the old row numbers (row 3 holds
    =D4*E4), so they show another item's value. The Total row, now row 16, still sums D2:D19 and
    F2:F19, a range that includes the Total row itself; LibreOffice reports #VALUE! for both totals.
    The Summary sheet still reads Stock!D20 and Stock!F20, where the Total row used to be; those cells
    are now empty.
  observed_zh: >
    四个 Discontinued 行已删除，剩下的 14 个商品位于第 2–15 行，但没有改写任何公式：14 个 Value 公式中有 13 个仍使用原来的行号
    （第 3 行是 =D4*E4），显示的是别的商品的值；合计行现在位于第 16 行，仍对 D2:D19 和 F2:F19 求和，这个区域把合计行自己也包含了进去，
    LibreOffice 对两个合计都报 #VALUE!；Summary 表仍读取合计行原来所在的 Stock!D20 和 Stock!F20，这两个单元格现在是空的。
  claim: >
    I deleted the discontinued items from the Stock sheet. The remaining rows are contiguous, and
    the totals on Stock and Summary are formulas, so they stay up to date.
  claim_zh: 我已从 Stock 表删除停产商品，剩余行连续排列；Stock 和 Summary 上的合计都是公式，会保持最新。
  explanation: >
    In a spreadsheet application, deleting rows rewrites every affected reference. openpyxl's
    delete_rows() only moves cells. The sheet looks tidy, and the damage shows up only in computed
    values that nobody recalculated.
  explanation_zh: >
    在表格软件中删除行时，所有受影响的引用都会被改写；openpyxl 的 delete_rows() 只移动单元格。
    表格看起来很整齐，损坏只体现在没人重新计算过的公式结果里。
  failing_rules: [values-correct, stock-totals-correct, summary-correct, totals-live]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    openpyxl delete_rows() moves cells but does not rewrite formulas (documented behaviour).
limitations:
  - en: 'The circular reference left by the failure shows as #VALUE! in LibreOffice; Excel would show a circular-reference warning instead.'
    zh: '失败产物留下的循环引用在 LibreOffice 中显示为 #VALUE!；Excel 则会显示循环引用警告。'
