id: xlsx-003
slug: rate-reference-drifts
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [formulas, absolute-references, fill-down]
title: Filling a formula down shifts the reference to the tax-rate cell
title_zh: 向下填充公式时，指向税率单元格的引用跟着偏移了
files:
  inputs: [invoice.xlsx]
  outputs: [invoice.xlsx]
failure:
  expected: >
    Every line's VAT is Net × the rate in B1 (exact or rounded to the cent) and its Gross is Net +
    VAT; the totals match, and changing B1, or a line's Qty or Unit Price, updates VAT and Gross on
    every line and in the Total row (for example because every VAT formula refers to its line's Net
    and to $B$1 or to a name). Net and Total Net are still calculated from Qty and Unit Price, as in
    the file as given.
  expected_zh: >
    每一行的 VAT 都等于 Net × B1 中的税率（精确值或取整到分），Gross = Net + VAT；合计一致，修改 B1
    或某一行的数量、单价，都会更新每一行以及 Total 行的 VAT 和 Gross（例如每个 VAT 公式都引用本行的
    Net，并以 $B$1 或名称引用税率）。Net 和 Net 合计仍像原文件一样由数量和单价计算。
  observed: >
    The rate reference in the VAT formulas moves down one row per line, as a relative fill-down
    does: E4 is =D4*B1 (correct), E5 is =D5*B2, E6 is =D6*B3, and so on to E15 =D15*B12, so only
    row 4 uses the rate. Row 5 multiplies by an empty cell, so its VAT is 0; row 6 multiplies by the
    "Qty" header and shows #VALUE!; rows 7 to 15 multiply their Net by the Qty of the line three rows
    above (1 to 22), so their VAT is 1 to 22 times their Net. Gross (=D+E) carries these errors, and
    the Total row's VAT and Gross show #VALUE!; only Total Net is correct.
  observed_zh: >
    VAT 公式中的税率引用每行下移一行，正如相对引用向下填充的结果：E4 为 =D4*B1（正确），E5 为 =D5*B2，
    E6 为 =D6*B3，依此类推直到 E15 为 =D15*B12，只有第 4 行用到了税率。第 5 行乘的是空单元格，VAT 为 0；
    第 6 行乘的是表头 “Qty”，显示 #VALUE!；第 7–15 行用 Net 乘以往上三行那一行的 Qty（1 到 22），
    VAT 成了 Net 的 1 到 22 倍。Gross（=D+E）随之出错，Total 行的 VAT 和 Gross 显示 #VALUE!，只有 Total Net 是对的。
  claim: >
    VAT and Gross are filled in for every line item using formulas that reference the VAT rate in B1,
    so changing B1 will update the whole invoice.
  claim_zh: 我已用公式为每个明细行填好 VAT 和 Gross，公式引用 B1 的税率，修改 B1 会更新整张发票。
  explanation: >
    The first row (the one most people check) is correct. Translating a formula to other rows is the
    normal way to fill a column, and the missing $ in $B$1 is a single character.
  explanation_zh: >
    第一行（大家最常检查的那一行）是对的。把公式平移到其他行本来就是填充整列的常规做法，而 $B$1 少掉的只是一个 $ 符号。
  failing_rules: [vat-correct, gross-correct, vat-follows-rate, vat-gross-follow-net, totals-correct]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    openpyxl's formula Translator shifts relative references by design, exactly like a fill-down.
limitations:
  - en: The rate change scenario uses one new rate; exotic formulas that special-case the original rate value would not be detected.
    zh: 税率变化场景只用一个新税率；针对原税率数值做特殊处理的奇怪公式检测不到。
  - en: Whether Net and Total Net are still calculated, and whether VAT and Gross follow Net, is tested in a second changed copy of the file (the k-th line's Qty raised by k and every Unit Price by 1.00, with the rate unchanged). There each VAT and Gross, on the lines and in the Total row, is compared with the Nets as they are in that copy (VAT = Net × rate, Gross = Net + VAT, a total = the sum of its lines or follows Total Net, cents rounding accepted), so a Net that did not follow is reported once, under net-still-calculated. Formula text is never inspected, so a formula that happens to give the right results in the file and in both changed copies passes.
    zh: Net 与 Net 合计是否仍随数量和单价变化、VAT 与 Gross 是否随 Net 变化，在第二个修改过的副本中检验（第 k 行的数量加 k，每个单价加 1.00，税率不变）。在该副本中，各行及 Total 行的每个 VAT 和 Gross 都与该副本中的 Net 比较（VAT = Net × 税率，Gross = Net + VAT，合计等于各行之和或随 Net 合计变化，可取整到分），因此没有随之变化的 Net 只在 net-still-calculated 中报告一次。检查不读公式文本，若某个公式恰好在原文件和两个修改过的副本中都给出正确结果，也会通过。
  - en: VAT and Gross are accepted exact or rounded to whole cents (at most one cent from the exact amount, in either direction). A total is accepted if it is exact, rounded to whole cents, or the sum of the accepted line amounts. Other rounding, for example to 0.1, fails.
    zh: VAT 与 Gross 可以是精确值，也可以取整到分（与精确值相差不超过 1 分，向上向下均可）。合计若为精确值、取整到分的值，或各行已接受金额之和，均判为正确。其他取整方式（例如取整到 0.1）判为失败。
