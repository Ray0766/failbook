id: xlsx-003
slug: rate-reference-drifts
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [formulas, absolute-references, fill-down]
title: Filling a formula down shifts the reference to the tax-rate cell
title_zh: 向下填充公式时，指向税率单元格的引用跟着偏移了
files:
  inputs: [invoice.xlsx]
  outputs: [invoice.xlsx]
failure:
  expected: >
    Every VAT formula refers to B1 absolutely (or through a name), so changing B1 updates every line
    and the totals.
  expected_zh: >
    每个 VAT 公式都以绝对引用（或名称）指向 B1，修改 B1 会更新每一行和合计。
  observed: >
    The agent wrote the VAT formula for the first line item as =D4*B1 and copied it down the column
    with relative references. The second line became =D5*B2, the third =D6*B3, and so on, so only the
    first line uses the VAT rate. The other lines show 0 or #VALUE!, and the invoice total is wrong.
  observed_zh: >
    智能体为第一行写了增值税公式 =D4*B1，然后按相对引用向下复制。第二行变成 =D5*B2，第三行变成 =D6*B3……
    只有第一行用到了税率，其余各行显示 0 或 #VALUE!，发票合计也随之出错。
  claim: >
    VAT and Gross are filled in for every line item using formulas that reference the VAT rate in B1,
    so changing B1 will update the whole invoice.
  claim_zh: 我已用公式为每个明细行填好 VAT 和 Gross，公式引用 B1 的税率，修改 B1 会更新整张发票。
  explanation: >
    The first row (the one most people check) is correct. Translating a formula to other rows is the
    normal way to fill a column, and the missing $ in $B$1 is a single character.
  explanation_zh: >
    第一行（大家最常检查的那一行）是对的。把公式平移到其他行本来就是填充整列的常规做法，而 $B$1 少掉的只是一个 $ 符号。
  failing_rules: [vat-correct, gross-correct, vat-follows-rate, totals-correct]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    openpyxl's formula Translator shifts relative references by design, exactly like a fill-down.
limitations:
  - en: The rate change scenario uses one new rate; exotic formulas that special-case the original rate value would not be detected.
    zh: 税率变化场景只用一个新税率；针对原税率数值做特殊处理的奇怪公式检测不到。
