id: xlsx-008
slug: percent-entered-as-whole-numbers
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [percentages, data-entry, number-formats]
title: Percentages typed as whole numbers become 100 times too large
title_zh: 百分比按整数录入，结果放大了 100 倍
files:
  inputs: [targets.xlsx]
  outputs: [targets.xlsx]
failure:
  expected: >
    Growth targets are stored as fractions (12% = 0.12) in the percentage-formatted cells, every 2025
    target equals revenue × (1 + growth), and the 2025 Target column, the Total row and the overall
    growth keep being calculated from the revenue and growth figures.
  expected_zh: >
    增长目标以小数（12% = 0.12）存入百分比格式单元格，每个 2025 目标 = 收入 × (1 + 增长率)，
    2025 Target 列、Total 行和整体增长率仍由收入和增长率计算得出。
  observed: >
    In the failure file the Growth Target cells C2 to C6 hold 8.5, 15, 8.5, 4.5 and 8, still
    formatted as 0.0%, so they display as 850.0%, 1500.0%, 850.0%, 450.0% and 800.0%. The 2025
    Target formulas are unchanged (=B2*(1+C2) and so on), so after recalculation each 2025 Target is
    the revenue multiplied by 9.5, 16, 9.5, 5.5 and 9: North's is 15,238,000 instead of 1,740,340.
    The Total 2025 Target is 100,014,500 against 9,986,000 of 2024 revenue, about 10 times as much,
    and the overall growth shows 901.5% instead of 9.0%.
  observed_zh: >
    失败文件中，Growth Target 单元格 C2 至 C6 存的是 8.5、15、8.5、4.5 和 8，格式仍为 0.0%，因此显示为
    850.0%、1500.0%、850.0%、450.0% 和 800.0%。2025 Target 公式未变（=B2*(1+C2) 等），所以重新计算后，每个
    2025 Target 都是收入乘以 9.5、16、9.5、5.5 和 9：North 为 15,238,000，应为 1,740,340。Total 的 2025 Target
    为 100,014,500，而 2024 年收入合计为 9,986,000，约为其 10 倍；整体增长率显示 901.5%，应为 9.0%。
  claim: >
    I updated the growth targets for all five regions. The 2025 Target column and the totals
    recalculate automatically.
  claim_zh: 我已更新五个区域的增长目标，2025 Target 列和合计会自动重新计算。
  explanation: >
    "12%" in a task and the number 12 in code look like the same thing. In a spreadsheet, a percentage
    is a fraction (0.12); the % format only changes how it is displayed.
  explanation_zh: >
    任务里的"12%"和代码里的数字 12 看起来是一回事。但在表格中，百分比是小数（0.12），百分比格式只改变显示方式。
  failing_rules: [growth-values, targets-correct]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    No tool fault: a percentage format only changes how a fraction is displayed.
limitations:
  - en: A value stored as the text '12%' is reported as not a number; the rule does not try to interpret text.
    zh: 以文本 '12%' 存储的值会被判为非数字，规则不尝试解析文本。
  - en: Whether the 2025 Target column, the Total row and the overall growth are still calculated is tested in one changed copy of the file (the k-th region's 2024 Revenue raised by 10,000 × k and its Growth Target set to its new target plus k percentage points, k = 1 to 5); formula text is never inspected.
    zh: 2025 Target 列、Total 行和整体增长率是否仍随收入和增长率变化，只在一个修改过的副本中检验（第 k 个区域的 2024 Revenue 加 10,000 × k，其 Growth Target 设为新目标加 k 个百分点，k = 1 至 5）；检查不读公式文本。
