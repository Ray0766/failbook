id: xlsx-011
slug: chart-range-not-extended
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [charts, ranges, append-rows]
title: New months are added, but the chart still stops at October
title_zh: 新月份数据加上了，图表却仍停在 10 月
files:
  inputs: [monthly.xlsx]
  outputs: [monthly.xlsx]
failure:
  expected: >
    The existing line chart keeps its title, and both series and the month labels cover January to
    December (rows 2–13).
  expected_zh: >
    原折线图标题不变，两条系列和月份标签都覆盖 1 月到 12 月（第 2–13 行）。
  observed: >
    The agent appended the November and December rows and reported that the chart now covers all
    twelve months. The chart's series still point to rows 2 to 11 (January to October). The new data
    is in the sheet but not in the chart.
  observed_zh: >
    智能体追加了 11 月和 12 月两行，并汇报说图表现在覆盖全部十二个月。但图表的数据系列仍指向第 2–11 行（1 月至 10 月）：
    新数据在表里，却不在图上。
  claim: >
    I added November and December below October. The chart is based on this data, so it now covers
    all twelve months.
  claim_zh: 我已在 10 月下方添加 11 月和 12 月的数据。图表基于这些数据，所以现在覆盖全部十二个月。
  explanation: >
    It is a common belief that charts grow with their data. They only do so when the source is an
    Excel table or a dynamic named range; a chart over a fixed range like B2:B11 keeps that range.
    Checking it requires looking at the chart's series definitions, not at the cells.
  explanation_zh: >
    很多人以为图表会随数据自动扩展。其实只有数据源是 Excel 表格（Table）或动态命名区域时才会；
    基于 B2:B11 这种固定区域的图表会一直停留在原区域。要发现问题，得去看图表的数据系列定义，而不是看单元格。
  failing_rules: [chart-covers-all-months]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    Charts over fixed ranges never grow by themselves; openpyxl keeps the chart and its ranges as
    they were.
limitations:
  - en: The rule reads series ranges from the chart XML. Charts fed by Excel tables or dynamic named ranges are not resolved and would need a rule extension.
    zh: 规则从图表 XML 读取系列区域；由 Excel 表格或动态命名区域驱动的图表暂不解析，需要扩展规则。
