id: xlsx-011
slug: chart-range-not-extended
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [charts, ranges, append-rows]
title: New months are added, but the chart still stops at October
title_zh: 新月份数据加上了，图表却仍停在 10 月
files:
  inputs: [monthly.xlsx]
  outputs: [monthly.xlsx]
failure:
  expected: >
    The existing line chart keeps its title, and the Revenue and Costs series and the month labels
    cover January to December (rows 2–13), starting at the same row and keeping their names.
  expected_zh: >
    原折线图标题不变，Revenue 和 Costs 两条系列及月份标签都覆盖 1 月到 12 月（第 2–13 行），
    起始行一致，系列名称保持不变。
  observed: >
    November and December are in rows 12 and 13 with the given figures. The chart's Revenue and Costs
    series and its month labels still point to rows 2 to 11 (Monthly!$B$2:$B$11, $C$2:$C$11 and
    $A$2:$A$11, January to October). The new data is in the sheet but not in the chart.
  observed_zh: >
    11 月和 12 月已按给定数值写在第 12、13 行。但图表的 Revenue、Costs 两条系列和月份标签仍指向第 2–11 行
    （Monthly!$B$2:$B$11、$C$2:$C$11 和 $A$2:$A$11，即 1 月至 10 月）：新数据在表里，却不在图上。
  claim: >
    I added November and December below October. The chart is based on this data, so it now covers
    all twelve months.
  claim_zh: 我已在 10 月下方添加 11 月和 12 月的数据。图表基于这些数据，所以现在覆盖全部十二个月。
  explanation: >
    It is a common belief that charts grow with their data. They only do so when the source is an
    Excel table or a dynamic named range; a chart over a fixed range like B2:B11 keeps that range.
    Checking it requires looking at the chart's series definitions, not at the cells.
  explanation_zh: >
    很多人以为图表会随数据自动扩展。其实只有数据源是 Excel 表格（Table）或动态命名区域时才会；
    基于 B2:B11 这种固定区域的图表会一直停留在原区域。要发现问题，得去看图表的数据系列定义，而不是看单元格。
  failing_rules: [chart-covers-all-months]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    Charts over fixed ranges never grow by themselves; openpyxl keeps the chart and its ranges as
    they were.
limitations:
  - en: >-
      The rule reads the series ranges, month labels and series names from the chart XML. A series that points
      at a defined name standing for a fixed range is resolved through the name; a name computed by a formula
      (OFFSET, INDEX) is not. A series over the Revenue or Costs column of Monthly is checked by its rows. A
      series over any other range (a helper sheet or column) counts as the Revenue or Costs line only when its
      cells, after recalculation, hold exactly that line's twelve January to December figures, so a helper
      range in another unit (thousands) does not count; month labels from another sheet or along a row must
      read Jan to Dec. Everything the checker can tie to a line or to the axis is checked first, and any error
      there fails the rule. Of a series it cannot resolve only the name is checked: when such series are the
      only ones that can draw a line, one of them must carry that line's name. Only when nothing is found wrong
      but some part cannot be resolved does the rule report inconclusive rather than pass or fail.
    zh: 规则从图表 XML 读取系列区域、月份标签和系列名称。指向固定区域的命名区域会被解析；由公式计算的名称（OFFSET、INDEX）无法解析。位于 Monthly 表 Revenue 或 Costs 列上的系列按行号检查；指向其他区域（辅助工作表或辅助列）的系列，只有在重算后其单元格恰好是该线 1 月到 12 月的十二个数值时，才算作 Revenue 或 Costs 线，因此换算成其他单位（如千）的辅助区域不算；来自其他工作表或按行排列的月份标签须读作 Jan 到 Dec。规则先检查所有能对应到某条线或分类轴的部分，其中任何错误都判失败。无法解析的系列只检查名称：若某条线只能由这类系列画出，其中必须有一条使用该线的名称。只有在没有发现错误、但有部分无法解析时，才判为"无法判定"，而不是通过或失败。
  - en: >-
      A line chart has one category axis, drawn from the first series that has category labels, so the month
      labels are checked there: a range, or a list typed into the chart, that reads Jan to Dec. Labels stored
      on later series are not drawn and not checked. LibreOffice 24.2 draws labels typed into the chart as
      1, 2, 3, … and drops them when it saves the file; the rule checks the typed text in the file it is given,
      so a typed list passes and the same file after a LibreOffice save fails.
    zh: 折线图只有一条分类轴，取自第一条带分类标签的系列，因此月份标签只在那里检查：可以是单元格区域，也可以是直接写进图表的列表，内容须为 Jan 到 Dec。后面系列上存的标签不会显示，也不检查。LibreOffice 24.2 会把直接写进图表的标签显示为 1、2、3……，并在保存时把它们丢掉；规则检查的是所交文件中写入的文字，因此直接写入的列表能通过，而同一文件经 LibreOffice 保存后会判失败。
