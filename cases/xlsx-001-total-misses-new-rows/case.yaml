id: xlsx-001
slug: total-misses-new-rows
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [formulas, ranges, insert-rows, totals]
title: New orders inserted above the Total row are left out of the total
title_zh: 在合计行上方插入新订单后，合计没有包含新订单
files:
  inputs: [sales.xlsx]
  outputs: [sales.xlsx]
failure:
  expected: >
    The three orders sit directly above the Total row, formatted like the other order rows, and
    every order's Amount (new and original) is Qty × Unit Price and follows its Qty and Unit Price. Total Qty and Total Amount include every
    order and change when any order changes.
  expected_zh: >
    三笔订单紧贴合计行上方，格式与其他订单行一致；每笔订单（新的和原有的）的 Amount 都等于 Qty × Unit Price，并随数量和单价变化。
    合计的 Qty 与 Amount 包含全部订单，并随任一订单变化。
  observed: >
    The three new orders (SO-1159 to SO-1161) are in rows 12 to 14, directly above the Total row
    (row 15), with Amount formulas like the other rows (=D12*E12). The Total row still reads
    =SUM(D2:D11) and =SUM(F2:F11), which cover the original order rows only: Total Qty is 198
    instead of 269 and Total Amount is 5,412.50 instead of 10,626.25, short by exactly the three new
    orders. In a copy of the file where every order's Qty is raised, Total Qty changes by +55
    instead of +91.
  observed_zh: >
    三笔新订单（SO-1159 至 SO-1161）位于第 12–14 行，紧贴合计行（第 15 行）上方，Amount 与其他行一样是公式（如 =D12*E12）。
    合计行仍是 =SUM(D2:D11) 和 =SUM(F2:F11)，只覆盖原有订单行：Total Qty 为 198（应为 269），
    Total Amount 为 5,412.50（应为 10,626.25），正好少了三笔新订单。在把每笔订单的数量都调高的副本中，
    Total Qty 只变化了 +55，应为 +91。
  claim: >
    Done. I added the 3 new orders above the Total row, with Amount formulas that match the existing
    rows. The Total row now reflects all orders.
  claim_zh: 已完成。我在合计行上方添加了 3 笔新订单，金额公式与原有行一致，合计行现在包含所有订单。
  explanation: >
    The new rows look right and the total is still a formula, so a quick glance passes. But
    openpyxl's insert_rows() moves cells without rewriting any formula, and even a spreadsheet
    application's own reference adjustment only grows a range when rows are inserted inside it:
    rows inserted just below F2:F11 (directly above the total) are outside the range.
  explanation_zh: >
    新行看起来没问题，合计也仍是公式，粗看就过了。但 openpyxl 的 insert_rows() 只移动单元格、不改写任何公式；
    即使是表格软件自带的引用调整，也只有在区域内部插入行时才会扩展区域——紧贴合计行上方（F2:F11 之下）插入的行在区域之外。
  failing_rules: [totals-include-all-orders, totals-are-live]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    openpyxl insert_rows() moves cells but does not rewrite formulas (documented behaviour).
limitations:
  - en: Liveness is tested in one changed copy of the file (every order's Qty raised by a different amount, every Unit Price by 1.00). Formula text is never inspected, so a formula that happens to give the right results for both the original and the changed inputs would pass.
    zh: 实时性只在一个修改过的副本中检验（每笔订单的数量各加上不同的值，每个单价加 1.00）。检查不读公式文本，因此若某个公式恰好在原始输入和修改后的输入下都给出正确结果，也会通过。
  - en: "\"In the same format as the other order rows\" is checked as the number formats of Date, Unit Price and Amount, the columns the original order rows format (yyyy-mm-dd, #,##0.00, #,##0.00). Formats that differ only in these ways count as the same (checked in LibreOffice 24.2 by showing dates, positive, negative and zero numbers and text, which they show alike): letter case; a literal written plainly, quoted or backslash-escaped (as LibreOffice saves it); a text section that is only @ (yyyy-mm-dd;@); a zero section equal to the first; a locale tag with no currency symbol on a date of digits written without / ([$-409]yyyy-mm-dd). A negative section that is - and a first section of digits (#,##0.00;-#,##0.00) also counts as the same, although it shows a negative number that rounds to zero as -0.00 where #,##0.00 shows 0.00: the task's prices and amounts are all positive. On a date it does not count (yyyy-mm-dd;-yyyy-mm-dd shows -1766.34 as -1904-10-31, not 1895-02-27). Under a locale tag, / in a date shows that locale's date separator. For the 15 tags tried in LibreOffice 24.2 (en-US system locale) the checker uses the separator shown there: LibreOffice re-saves [$-41D]yyyy-mm-dd as [$-41D]yyyy/mm/dd, which still shows 2024-03-02 and passes, while [$-409]yyyy/mm/dd shows 2024/03/02 and [$-407]yyyy/mm/dd 2024.03.02, which fail. For any other tag, a date format that matches apart from / is INCONCLUSIVE, neither a pass nor a fail. Excel's display was not tried. Any other difference fails, even where the cells happen to look the same here: a time part in the date format, 0.00 instead of #,##0.00, an empty section (it hides values), or a locale tag on #,##0.00 (it sets the separators: [$-407]#,##0.00 shows 1.766,34). Order ID, Customer and Qty (General in the original rows), fonts, fills, borders and alignment are not compared."
    zh: "“格式与其他订单行保持一致”按数字格式检查：比较 Date、Unit Price 和 Amount 三列，即原有订单行设置了格式的列（yyyy-mm-dd、#,##0.00、#,##0.00）。只在以下方面不同的格式视为同一格式（已在 LibreOffice 24.2 中用日期、正数、负数、零和文本核对，显示相同）：字母大小写；字面字符直接写、加引号或用反斜杠转义（如 LibreOffice 保存的写法）；只含 @ 的文本段（yyyy-mm-dd;@）；与第一段相同的零值段；不含 / 的纯数字日期上不带货币符号的地区标记（[$-409]yyyy-mm-dd）。由 - 加只含数字的第一段构成的负数段（#,##0.00;-#,##0.00）也视为同一格式，尽管它把舍入为零的负数显示为 -0.00，而 #,##0.00 显示 0.00：本任务的单价和金额都是正数。日期上的这种负数段不算同一格式（yyyy-mm-dd;-yyyy-mm-dd 把 -1766.34 显示为 -1904-10-31，而不是 1895-02-27）。在地区标记下，日期中的 / 显示该地区的日期分隔符。对在 LibreOffice 24.2（系统区域为 en-US）中试过的 15 个地区标记，检查器采用那里显示的分隔符：LibreOffice 把 [$-41D]yyyy-mm-dd 另存为 [$-41D]yyyy/mm/dd，显示仍为 2024-03-02，判为通过；[$-409]yyyy/mm/dd 显示 2024/03/02、[$-407]yyyy/mm/dd 显示 2024.03.02，判为失败。对其他地区标记，除 / 外都相同的日期格式判为 INCONCLUSIVE，既不通过也不失败。未在 Excel 中验证显示效果。其他差异即使在这里碰巧显示相同也判为失败：日期格式带时间部分、用 0.00 代替 #,##0.00、空的格式段（会隐藏数值），或 #,##0.00 上的地区标记（它决定分隔符：[$-407]#,##0.00 显示为 1.766,34）。Order ID、Customer 和 Qty（原有行为 General）以及字体、填充、边框和对齐不作比较。"
