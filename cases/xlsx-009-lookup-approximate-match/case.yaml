id: xlsx-009
slug: lookup-approximate-match
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [lookup, vlookup, formulas, silent-wrong-values]
title: A lookup without exact match returns another product's data
title_zh: 查找公式没有使用精确匹配，返回了别的产品的数据
files:
  inputs: [orders.xlsx]
  outputs: [orders.xlsx]
failure:
  expected: >
    Category and Unit Price come from exact-match lookups, so every order shows its own SKU's
    category and price, and they follow changes on the Products sheet.
  expected_zh: >
    Category 与 Unit Price 来自精确匹配查找，每个订单显示其 SKU 对应的类别和价格，并随 Products 表变化。
  observed: >
    The agent filled Category and Unit Price with =VLOOKUP(B2,Products!$A$2:$C$17,2) and left out the
    fourth argument. VLOOKUP then defaults to approximate match, which assumes the product list is
    sorted by SKU. It is not, so the lookup returns some neighbouring product's category and price
    for many orders. Every cell shows a valid-looking value and nothing is flagged as an error.
  observed_zh: >
    智能体用 =VLOOKUP(B2,Products!$A$2:$C$17,2) 填写 Category 和 Unit Price，省略了第四个参数。
    此时 VLOOKUP 默认为近似匹配，并假定产品表按 SKU 排序；而产品表并未排序，于是很多订单查到的是相邻某个产品的类别和单价。
    每个单元格都显示着看似有效的值，没有任何错误提示。
  claim: >
    Category and Unit Price are now looked up from the Products sheet with VLOOKUP formulas, and
    Amount is Qty x Unit Price for every order.
  claim_zh: Category 和 Unit Price 现已通过 VLOOKUP 公式从 Products 表查得，每个订单的 Amount = Qty × Unit Price。
  explanation: >
    A wrong lookup still returns a real category and a real price. Without comparing a few rows
    against the product list by hand, the sheet looks complete and correct.
  explanation_zh: >
    错误的查找仍会返回一个真实存在的类别和价格。不拿几行去手工对照产品表，整张表看起来完整又正确。
  failing_rules: [categories-correct, prices-correct, amounts-correct]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    VLOOKUP's range_lookup argument defaults to approximate match (documented spreadsheet
    behaviour).
limitations:
  - en: 'Approximate VLOOKUP on unsorted data is not standardised: Excel and LibreOffice may return different wrong rows. The rules only check for the correct values, so both engines flag the failure, but the wrong values shown can differ.'
    zh: 在未排序数据上做近似 VLOOKUP 没有统一标准：Excel 与 LibreOffice 可能返回不同的错误行。规则只检查正确值，所以两个引擎都会判失败，但显示的错误值可能不同。
