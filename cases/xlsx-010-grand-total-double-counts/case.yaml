id: xlsx-010
slug: grand-total-double-counts
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [totals, subtotals, double-counting, formulas]
title: A grand total sums the subtotals as well, counting everything twice
title_zh: 总计把小计也一起加了进去，所有数字都算了两遍
files:
  inputs: [regional.xlsx]
  outputs: [regional.xlsx]
failure:
  expected: >
    The Grand Total equals the sum over rep rows (equivalently, the sum of the subtotals) for Q1–Q4
    and Year.
  expected_zh: >
    Grand Total 的 Q1–Q4 与 Year 等于所有代表行之和（即各小计之和）。
  observed: >
    Row 18 is labelled Grand Total and holds =SUM(C2:C17) to =SUM(G2:G17), one sum over the whole
    column. That range includes the four subtotal rows, so every Grand Total figure is exactly twice
    the total over the reps (Q1 805,400 instead of 402,700).
  observed_zh: >
    第 18 行标为 Grand Total，内容是 =SUM(C2:C17) 到 =SUM(G2:G17)，即对整列求和。这个区域包含了四个小计行，
    于是 Grand Total 的每个数字都恰好是全部代表合计的两倍（Q1 为 805,400，而不是 402,700）。
  claim: >
    I added a Grand Total row below the last subtotal. It sums Q1 to Q4 and the Year column across
    all regions.
  claim_zh: 我在最后一个小计行下方添加了 Grand Total 行，对所有区域的 Q1–Q4 和 Year 列求和。
  explanation: >
    SUM over the whole column is the obvious formula and usually right. A doubled total is easy to
    believe when there is nothing to compare it with.
  explanation_zh: >
    对整列求和是最顺手的公式，通常也没错；而当没有可对照的数字时，翻倍的总计也很容易被当真。
  failing_rules: [grand-total-values, grand-total-live]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    No tool fault: the SUM range includes the subtotal rows.
limitations:
  - en: The live rule adds 100 to one figure in each quarter, each in a different rep's row, and expects +100 in each quarter's Grand Total and +400 in Year. A Grand Total that leaves out rows other than the four bumped ones is caught only by the value rule.
    zh: 实时性规则在每个季度各给一位不同代表的数字加 100，要求各季度 Grand Total 增加 100、Year 增加 400。若 Grand Total 漏掉的是这四行以外的行，只能由数值规则抓出。
