id: xlsx-012
slug: typo-fix-wipes-workbook
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: easy
tags: [collateral-damage, pandas, formatting, formulas, data-validation]
title: Fixing a typo with pandas wipes out the rest of the workbook
title_zh: 用 pandas 改一个错字，却毁掉了工作簿的其余部分
files:
  inputs: [customers.xlsx]
  outputs: [customers.xlsx]
failure:
  expected: >
    Only the misspelled City cells change. All sheets, formulas, header styling, number formats,
    column widths, the frozen header and the Tier dropdown remain.
  expected_zh: >
    只有拼错的 City 单元格改变；所有工作表、公式、表头样式、数字格式、列宽、冻结表头和 Tier 下拉列表都保留。
  observed: >
    The four misspelled cities now read "Beijing", but the file was written anew. It has only the
    Customers sheet: Regions and Notes are gone. The Region column holds fixed text instead of
    formulas, still "Unknown" for the four corrected rows. The header is no longer bold or filled, the
    column widths, the frozen header and the Tier dropdown are gone, and the Since dates now have the
    number format YYYY-MM-DD HH:MM:SS.
  observed_zh: >
    四处拼错的城市已改为 "Beijing"，但整个文件被重新写过：只剩 Customers 一张表，Regions 和 Notes 都没了；
    Region 列存的是固定文本而不是公式，四个被修正的行仍显示 "Unknown"；表头不再加粗、没有填充色，列宽、冻结表头和
    Tier 下拉列表都没了，Since 日期的数字格式变成了 YYYY-MM-DD HH:MM:SS。
  claim: >
    Fixed: every 'Bejing' in the Customers sheet now reads 'Beijing'. Nothing else was changed.
  claim_zh: 已修复：Customers 表中所有 'Bejing' 都已改为 'Beijing'，其他内容均未改动。
  explanation: >
    The requested change is correct and easy to verify, and a DataFrame round trip is the shortest
    code. to_excel() writes a new file containing only the DataFrame's values, which loses
    formulas, styles, validation and every other sheet, but it does not warn about any of it.
  explanation_zh: >
    要求的修改本身正确且容易核对，用 DataFrame 读写一遍也是最短的代码。但 to_excel() 会写出一个只含 DataFrame 数值的新文件：
    公式、样式、数据验证和其他所有工作表都会丢失，而且没有任何提示。
  failing_rules: [customer-data-unchanged, other-sheets-unchanged, formatting-kept, dropdown-kept]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
