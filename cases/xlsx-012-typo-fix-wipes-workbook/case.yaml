limitations:
  - en: Formatting checks compare every Customers cell's bold, italic, underline, strikethrough, font colour, solid fill, horizontal alignment and number format with the input, plus column widths (±1.5), frozen panes, the filter range and the number of conditional-format rules. Font names and sizes, borders and patterned fills are not compared.
    zh: 格式检查把 Customers 表每个单元格的加粗、斜体、下划线、删除线、字体颜色、纯色填充、水平对齐和数字格式与输入比较，另外比较列宽（±1.5）、冻结窗格、筛选区域和条件格式规则数量。字体名称与字号、边框和图案填充不比较。
