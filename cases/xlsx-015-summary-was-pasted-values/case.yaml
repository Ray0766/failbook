id: xlsx-015
slug: summary-was-pasted-values
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [stale-values, assumptions, verification, totals]
title: Data corrected, but the summary was pasted values and never updates
title_zh: 数据改对了，但汇总表是粘贴的静态数值，根本不会更新
files:
  inputs: [budget.xlsx]
  outputs: [budget.xlsx]
failure:
  expected: >
    Q3 Data holds the three corrected figures and the Summary totals match the corrected data,
    whether they are formulas or values.
  expected_zh: >
    Q3 Data 中三处数字已更正，Summary 的合计（公式或数值均可）与更正后的数据一致。
  observed: >
    The three corrections are applied in Q3 Data. The Summary sheet, as in the input, holds plain
    numbers rather than formulas, and they were not changed: Marketing, Operations and Engineering
    still show their old totals (Engineering 117,810 instead of 115,520), and the grand total is
    690,630 instead of 686,420.
  observed_zh: >
    Q3 Data 中的三处更正已完成。但 Summary 表和输入文件一样，存的是普通数字而不是公式，而且没有被改动：
    Marketing、Operations 和 Engineering 仍显示旧的合计（Engineering 为 117,810，而不是 115,520），
    总计为 690,630，而不是 686,420。
  claim: >
    I applied the 3 corrections in Q3 Data. The Summary totals are derived from this sheet, so they
    now reflect the corrected figures.
  claim_zh: 我已在 Q3 Data 中完成 3 处更正。Summary 的合计来自这张表，所以现在已反映更正后的数字。
  explanation: >
    The agent assumed how the workbook works instead of checking. "The summary updates
    automatically" is usually true, so the claim sounds safe, but nobody looked at whether the
    Summary cells were formulas or what they showed after the change.
  explanation_zh: >
    智能体没有核实，而是想当然地推断工作簿的运作方式。"汇总会自动更新"通常是对的，所以这句话听起来很稳妥；
    但没人去看 Summary 单元格到底是不是公式、改完后显示的是什么。
  failing_rules: [summary-dept-totals, summary-grand-total]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    No tool fault: the Summary held pasted values, which no tool recalculates.
limitations:
  - en: The task does not require formulas on the Summary; correct static values pass, which the alternative solution proves.
    zh: 任务不要求 Summary 使用公式；正确的静态数值也能通过，替代解法证明了这一点。
  - en: >-
      On the Summary, the labels (the header row and column A) must read as in the input and no cell may be
      filled outside the original table; only the totals may change. Case and spacing of labels are ignored,
      and formatting (fonts, number formats) is not compared.
    zh: Summary 上的标签（表头行和 A 列）须与输入一致，原表格范围之外不能新增内容，只有合计可以改变。标签的大小写和空格差异不计，格式（字体、数字格式）不做比较。
inputs:
  source: synthetic   # generated by case.py from fictional data (src/failbook/kit.py)
  license: MIT
provenance:
  kind: reconstructed
  note: >
    The failure artifact is produced by failure.py, which updates only the data cells. It reproduces a
    commonly reported failure pattern; it is not attributed to any specific model run.
