id: xlsx-013
slug: dropdown-and-highlight-not-extended
version: 1
status: checker-verified   # draft | checker-verified | observed (a recorded run reproduced it) | retired
domain: spreadsheet
difficulty: medium
tags: [data-validation, conditional-formatting, append-rows]
title: New rows get no dropdown and no highlighting
title_zh: 新增的行既没有下拉列表，也没有高亮规则
files:
  inputs: [tracker.xlsx]
  outputs: [tracker.xlsx]
failure:
  expected: >
    The Status dropdown and the red 'Blocked' highlight cover every task row, including the five new
    ones.
  expected_zh: >
    Status 下拉列表和 'Blocked' 红色高亮覆盖所有任务行（含五个新行）。
  observed: >
    The five new tasks are in rows 14 to 18 with the given values. The Status dropdown and the red
    "Blocked" highlight are still defined for D2:D13 only, which ends at the old last row, so the new
    rows accept any text and the two new "Blocked" tasks (rows 15 and 16) are not highlighted.
  observed_zh: >
    五条新任务已按给定内容写在第 14–18 行。但 Status 下拉列表和"Blocked"红色高亮仍只定义在 D2:D13，止于原来的最后一行。
    于是新行可以输入任何文本，两条新的"Blocked"任务（第 15、16 行）也没有高亮。
  claim: >
    I added the 5 new tasks at the end of the tracker, with the same formatting as the existing rows.
  claim_zh: 我已在任务表末尾添加 5 条新任务，格式与现有行一致。
  explanation: >
    Validation and conditional formatting are invisible in the cell values the agent writes and
    reads back. They live in separate range lists that someone has to extend on purpose.
  explanation_zh: >
    数据验证和条件格式在智能体写入、读回的单元格值里是看不见的。它们保存在独立的区域列表中，必须有意识地去扩展。
  failing_rules: [dropdown-covers-new-rows, highlight-covers-new-rows]
classification:
  # model | tool | environment | evaluator | undetermined (see docs/FAILURE_TAXONOMY.md)
  category: model
  evidence: reconstructed   # reconstructed | observed (observed needs a linked run record)
  tool_behaviour: >
    Data validation and conditional formatting apply to fixed ranges; appending rows does not extend
    them.
limitations:
  - en: >-
      The highlight rule evaluates the conditional formats on each Status cell for the current Status and for
      each of the four statuses. It understands cell-value rules, text rules (contains, begins with, ends with)
      and formula rules built from cell references, text, comparisons and a few functions (AND, OR, NOT, IF,
      EXACT, SEARCH, FIND, LEFT, RIGHT, LEN, TRIM, ISNUMBER, ISERROR ...). Dates compare as serial numbers,
      sheet names match in any letter case, and a name the workbook does not define gives #NAME?, so its rule
      does not apply. Other rule types and functions, defined names, and colours it cannot resolve make the rule
      inconclusive. A colour counts as red when its hue is between 340 and 15 degrees, its saturation (HSV) is
      at least 15% and its brightness at least 25%, so light red fills such as FFC7CE count. A pale red, with
      saturation from 5% to below 15% and brightness at least 80% (such as F2DCDB, the theme colour "Red, Accent
      2, Lighter 80%"), makes the rule inconclusive; darker colours of such low saturation (greys and browns such
      as 5A5050) are not red. A conditional fill with patternType "none" is no fill. A conditional fill that gives only
      a pattern colour (fgColor) and no pattern type is inconclusive too: LibreOffice paints nothing for it, and
      what Excel paints is not established. A cell's own fill is not considered, only conditional formatting.
    zh: >-
      高亮规则针对每个 Status 单元格，分别在当前状态和四种状态下计算条件格式的效果。它能理解"单元格值"规则、文本规则（包含、开头是、结尾是），以及由单元格引用、文本、比较和少数函数（AND、OR、NOT、IF、EXACT、SEARCH、FIND、LEFT、RIGHT、LEN、TRIM、ISNUMBER、ISERROR 等）组成的公式规则。日期按序列号比较；工作表名不区分大小写；工作簿中未定义的名称得到 #NAME?，该规则因此不生效。其他规则类型、函数、命名区域或无法解析的颜色会使该规则判为"无法判定"。色相在 340 到 15 度之间、饱和度（HSV）不低于 15%、亮度不低于 25% 的颜色算红色，因此 FFC7CE 这类浅红填充也算。饱和度不低于 5% 但低于 15%、且亮度不低于 80% 的淡红色（例如主题色 "Red, Accent 2, Lighter 80%"，即 F2DCDB）会使该规则判为"无法判定"；饱和度同样低但更暗的颜色（如 5A5050 这类灰色、棕色）不算红色。patternType 为 "none" 的条件格式填充视为无填充。只给出图案颜色（fgColor）而没有图案类型的条件格式填充也判为"无法判定"：LibreOffice 对它不显示任何填充，Excel 的显示效果未经确认。只考虑条件格式，不考虑单元格本身的填充色。
  - en: >-
      A dropdown whose options come from a range or from a defined name (in any script) that stands for a fixed
      range is resolved, with the sheet name in any letter case; other sources (INDIRECT, OFFSET), and a range on
      a sheet the workbook does not have, make the dropdown rule inconclusive. A list validation
      with showDropDown="1" hides the in-cell list, so its cells count as having no dropdown. The original
      validation refuses other entries (a "Stop" error alert), so every Status cell must still do so; an alert
      that is off, or of style Warning or Information, lets other text through and fails the rule.
    zh: 下拉列表的选项来自区域或指向固定区域的命名区域（名称可用任何文字）时会被解析，工作表名不区分大小写；其他来源（INDIRECT、OFFSET）以及位于工作簿中不存在的工作表上的区域，会使下拉列表规则判为"无法判定"。showDropDown="1" 的列表验证会隐藏单元格内的下拉列表，因此其覆盖的单元格视为没有下拉列表。原有验证会拒绝列表以外的输入（"停止"样式的出错警告），所以每个 Status 单元格仍须如此；关闭出错警告，或改用"警告""信息"样式，都会放行其他文本，判为不通过。
