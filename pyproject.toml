[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failbook"
version = "0.1.0"
description = "Reproducible cases where an AI agent said 'done' but the work was wrong, with fair, re-runnable acceptance checks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Failbook contributors" }]
keywords = ["ai", "agents", "evaluation", "benchmark", "spreadsheet", "excel", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "openpyxl>=3.1,<4",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pandas>=2",
]

[project.scripts]
failbook = "failbook.cli:main"

[project.urls]
Homepage = "https://github.com/Ray0766/failbook"
Issues = "https://github.com/Ray0766/failbook/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
