# Audit regression corpus: see README.md in this directory for what the fields mean.
# Each probe is audited without recalculation by tests/test_audit_corpus.py; its outcome must stay within
# its label (a documented limitation's outcome is pinned by 'now').
- id: review2-s01-chartsheet-edit
  label: clean
  edit: Data holds six months in B2:B7 with Total =SUM(B2:B7) in B8, and a chart sheet 'Chart' shows a bar chart
    'Revenue' over Data!B2:B7. The edit corrects one value, Data!B3 from 200 to 250. Nothing else changes.
  why: Correcting one value is a correct edit, so the audit must report nothing. The second review found that, when
    given the original, the audit crashed with a traceback (exit code 1) on any workbook with a chart sheet. This
    pair checks that such a workbook is now compared and gets no finding.
  after: review2/s01-after.xlsx
  before: review2/s01-before.xlsx
  source: review-2
- id: review2-s02-rename-append
  label: clean
  edit: Sheet Data (Region, Rep, Revenue for 12 reps in rows 2-13) is renamed 'Sales 2024', and 15 new rep rows
    are appended in rows 14-28. Summary!B2:B4 (SUM, COUNTA and SUMIF over Data rows 2-13) are rewritten to read
    'Sales 2024' rows 2-28.
  why: The rename and the new rows are both correct and every Summary reference follows them, so no finding is right;
    the second review found the audit reported this as sheet-removed and said the new sheet held only 46% of the
    old cells, although it keeps all of them.
  after: review2/s02-append-after.xlsx
  before: review2/s02-append-before.xlsx
  source: review-2
- id: review2-s02-rename-sort
  label: clean
  edit: Sheet Data is renamed 'Sales 2024' and its 12 rows are sorted by Revenue, highest first. Summary!B2:B4 (=SUM(Data!C2:C13),
    =COUNTA(Data!B2:B13) and =SUMIF(Data!A2:A13,"North",Data!C2:C13)) are rewritten to read the same rows of 'Sales
    2024'. Each one covers all 12 rows, so the new order does not change their results.
  why: A rename plus a sort, with every reference rewritten, is a correct edit, so no finding is right; the second
    review found it reported as sheet-removed (8% similar), because the match compared cells by position.
  after: review2/s02-sort-after.xlsx
  before: review2/s02-sort-before.xlsx
  source: review-2
- id: review2-s02-rename-title
  label: clean
  edit: Sheet Data is renamed 'Sales 2024' and a title row 'Sales by rep, 2024' is inserted at A1, so the headers
    move to row 2 and the data to rows 3-14. Summary!B2:B4 are rewritten to read 'Sales 2024' rows 3-14.
  why: Every Summary formula follows both the rename and the inserted title row, so the edit is correct and no finding
    is right; the second review found it reported as sheet-removed with no hint, because every cell had moved down
    one row.
  after: review2/s02-title-after.xlsx
  before: review2/s02-title-before.xlsx
  source: review-2
- id: review2-s03-lost-sheet
  label: any
  edit: The original has one sheet 'Jan' with Budget and Actual for six categories in B2:C7, Variance =C2-B2 ...
    in D2:D7 and a Total row 8. The edit renames it 'Feb' and replaces the Budget and Actual figures in B2:C7 except
    B4, which stays 1400. The labels and formulas are kept. The pair was built for the task of adding a 'Feb' sheet
    and keeping 'Jan', so January's figures are lost.
  why: 'Informational only. Without the task, the result cannot be told apart from a correct rename-and-update:
    15 of Jan''s 23 constants, counted with repeats wherever they are, are found in ''Feb'', more than the half
    that counts as a rename. If the numbers had been overwritten without the rename, the audit would also say nothing,
    because it never reports changed values in a sheet that keeps its name. So the second review accepted that no
    finding here is a trade-off, not a defect.'
  after: review2/s03-after.xlsx
  before: review2/s03-before.xlsx
  known_limit: true
  now: clean
  source: review-2
- id: review2-s04-inscol
  label: clean
  edit: Orders has Item, Qty, Price, Total, with =B2*C2 ... =B5*C5 in D2:D5 and =SUM(D2:D5) in D6. An empty 'Notes'
    column is inserted at D, so the Total column moves to E with its formulas unchanged (=B2*C2 in E2), and the
    column total becomes =SUM(E2:E5) in E6.
  why: 'This is what Excel produces: the formulas read columns B and C, which are left of the insert and did not
    move, so their unchanged text is right; the second review found the audit reported it as an error formula-moved-as-text.'
  after: review2/s04-inscol-after.xlsx
  before: review2/s04-inscol-before.xlsx
  source: review-2
- id: review2-s04-gaprow
  label: clean
  edit: Sales has nine months in B2:B10 and Total =SUM(B2:B10) in row 11. A blank row is inserted at row 11, so
    the Total moves to row 12 with its formula unchanged.
  why: Excel keeps =SUM(B2:B10) when a row is inserted below the range, and the cells it reads did not move, so
    no finding is right; the second review found this reported as an error formula-moved-as-text.
  after: review2/s04-gaprow-after.xlsx
  before: review2/s04-gaprow-before.xlsx
  source: review-2
- id: review2-s04-ledger
  label: clean
  edit: A cash ledger (Date, Description, Amount, Balance in rows 2-9) has the opening balance =C2 in D2 and =D{r-1}+C{r}
    in D3:D9. A 'Refund' of 25, dated 2024-03-05 like the 'Fuel' row above it, is inserted at row 6, and the balance
    is filled down again, so D3:D10 each read the row above (D6 =D5+C6 ... D10 =D9+C10).
  why: Inserting the row and filling the balance down again is what a user does in Excel, so the ledger is correct
    and must not get an error. SKILL.md gives a refilled balance no finding when its own row or the row it reads
    is new (D6 and D7, next to the new Refund row), or when the row it reads holds the content that was next to
    it before (D8:D10). The date 2024-03-05 now appears in both A5 and A6, so these rows have to be told apart by
    their other cells. The second review found reference-meaning-changed errors at D7, D8 and D9. SKILL.md now promises
    no finding.
  after: review2/s04-ledger-after.xlsx
  before: review2/s04-ledger-before.xlsx
  source: review-2
- id: review2-s04-halves
  label: clean
  edit: Sales has monthly revenue for 2024-01 to 2024-12 (labels in A2:A13, values in B2:B13) and Total =SUM(B2:B13)
    in row 14. The edit adds 'H1' =SUM(B2:B7) in row 15 and 'H2' =SUM(B8:B13) in row 16.
  why: H1 and H2 split the twelve months exactly and sit below a total that covers them, so they are deliberate
    half-year sums and no finding is right (as for the quarters in fix1-quarters-below-total); the second review
    found both reported as range-omits-adjacent-cells errors.
  after: review2/s04-halves-after.xlsx
  before: review2/s04-halves-before.xlsx
  source: review-2
- id: review2-s05-cached-errors
  label: warning|clean
  edit: 'A single file with no original. Sheet Calc has C2 =10/B2 with B2 = 0, and C3 =#REF!*2. The file was saved
    by LibreOffice 24.2 after recalculation, so the values cached in it are #DIV/0! and #REF!.'
  why: Without recalculation the audit does not check error values, not even the ones cached in the file (its --no-recalc
    help says so), so it must not report an error from them; the second review accepted either a true help text
    or a warning. With LibreOffice it must report the errors.
  after: review2/s05-saved.xlsx
  libreoffice_sample: true
  with_libreoffice: error
  source: review-2
- id: review2-s07-truncated
  label: unreadable
  edit: 'A single file: the first 3,000 bytes of a valid 7,253-byte .xlsx, as an interrupted save can leave it.
    It starts with a zip header, but the rest of the archive, including its directory, is missing.'
  why: Nothing in it can be read, so the audit must refuse it with exit code 3 and a short reason; the second review
    found it crashed with a zip traceback and exit code 1, which is the code for 'errors found'.
  after: review2/s07-truncated.xlsx
  source: review-2
- id: review2-s07-encrypted
  label: unreadable
  edit: A single file named .xlsx that starts with the OLE compound-file signature (D0 CF 11 E0 A1 B1 1A E1), followed
    by 4,000 bytes that hold no workbook. This is the container format of a password-protected workbook or a legacy
    .xls, not a zip.
  why: The file is not a zip-based workbook, so the audit must refuse it (exit code 3) and say it may be password-protected
    or a legacy .xls; the second review found a raw traceback with exit code 1 instead.
  after: review2/s07-encrypted.xlsx
  source: review-2
- id: review2-s08-xlsm
  label: clean
