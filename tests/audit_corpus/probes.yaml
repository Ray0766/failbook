    in D4. The edited file is the same workbook repackaged as a macro-enabled .xlsm. The workbook part's content
    type becomes the macro-enabled one, and an xl/vbaProject.bin part is added with its relationship and content
    type. That part is a 516-byte placeholder (the bytes D0 CF 11 E0 followed by zeros), not a working macro project.
    Every cell is the same.
  why: No sheet, cell or formula changed, so the audit must read the .xlsm as it reads an .xlsx and report nothing.
  after: review2/s08-macro.xlsm
  before: review2/s08-plain.xlsx
  source: review-2
